<html>
<head><script src="../../../common/phaser.min.js"></script></head>
<body>
<div id="game-container"></div>

<script>
    const config = {
    type: Phaser.CANVAS,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

    const game = new Phaser.Game(config);
    let background;
    let player;
    let boat1;
    let boat2;
    let boat3;
    let cursors;

    function preload(){
        this.load.image('background', 'empty-project/board.png');
        this.load.image('aircraft', 'empty-project/aircraft.png');
        this.load.image('boat', 'empty-project/enemy.png');
    }

    function create(){
        background = this.add.sprite(400, -1500 + 600, 'background');//pic size: 800x3000
        boat1 = this.add.sprite(210, -10, 'boat');
        boat2 = this.add.sprite(0, -510, 'boat');
        boat3 = this.add.sprite(151, -320, 'boat');

        player = this.add.sprite(300, 550, 'aircraft');
        cursors = this.input.keyboard.createCursorKeys();
    }

    function update(time, delta){
        background.y += 1;
        checkBackgroundCollision();
        checkKeys();
        moveBoats();
    }

    function moveBoats(){
        boat1.y++;
        boat1.x += 0.2;
        boat2.y++;
        boat2.x += 0.5;
        boat3.y++;
        boat3.x += 0.3;
    }

    function checkBackgroundCollision(){
        const ctx = game.canvas.getContext('2d');
        const leftTopPixel = ctx.getImageData(player.x - Math.floor(79/2), 600-50, 1, 1).data;
        const rightTopPixel = ctx.getImageData(player.x + Math.floor(79/2), 600-50, 1, 1).data;

        const groundColor = [136, 0, 21];
        const riverColor = [63, 72, 204];

        const pixelsToCheck = [leftTopPixel, rightTopPixel];

        pixelsToCheck.forEach(pixelColor =>{
            if (pixelColor[0] === groundColor[0] && pixelColor[1] === groundColor[1] && pixelColor[2] === groundColor[2])
                gameOver();
        });
    }

    function gameOver(){
        window.alert('GAME OVER!');
        location.reload();
    }

    function checkKeys(){
        const speed = 4;
        if (cursors.left.isDown){
            player.x -= speed;
        } else if (cursors.right.isDown){
            player.x += speed;
        }
    }

</script>
</body>
</html>
