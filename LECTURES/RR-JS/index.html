<html>
<head><script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script></head>
<body>
<div id="game-container"></div>

<script>
    const config = {
    type: Phaser.CANVAS,
    width: 800,
    height: 600,
    parent: 'game-container',
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

    const game = new Phaser.Game(config);
    let background;
    let player;



    function preload(){
        this.load.image('background', 'empty-project/board.png');
        this.load.image('aircraft', 'empty-project/aircraft.png');
    }

    function create(){
        background = this.add.sprite(300, 0, 'background');
        player = this.add.sprite(300, 550, 'aircraft');
    }

    function update(time, delta){
        background.y += 1;
        checkBackgroundCollision();
    }

    function checkBackgroundCollision(){
        const ctx = game.canvas.getContext('2d');
        const leftTopPixel = ctx.getImageData(player.x - Math.floor(79/2), 600-50, 1, 1).data;
        const rightTopPixel = ctx.getImageData(player.x + Math.floor(79/2), 600-50, 1, 1).data;

        const groundColor = [136, 0, 21];
        const riverColor = [63, 72, 204];

        const pixelsToCheck = [leftTopPixel, rightTopPixel];

        pixelsToCheck.forEach(pixelColor =>{
            if (pixelColor[0] === groundColor[0] && pixelColor[1] === groundColor[1] && pixelColor[2] === groundColor[2])
                gameOver();
        });
    }

    function gameOver(){
        window.alert('GAME OVER!');
        location.reload();
    }

</script>
</body>
</html>
