<html>
    <head>
        <script src="
https://cdn.jsdelivr.net/npm/pha
ser@3/dist/phaser.js">

        </script>
    </head>
    <body>
        <div id="score">SCORE:0</div>
        <div id="game-container"></div>
        <script>
            const config = {
                type: Phaser.AUTO,
                width: 800,
                height: 600,
                parent: 'game-container',
                scene: {
                    preload: preload,
                    create: create,
                    update: update
                }

            }

            const game = new Phaser.Game(config);
        let sprites = [];
        let player;
        let score = 0;

        const spriteCount = 12;
        const speed = 5;
        let cursors;
           function preload(){
                this.load.image("balloon", "balloon.png");
                this.load.spritesheet('digdug', 'dig-dug.png', {
                    frameWidth: 75,
                    frameHeight: 75
                });
           }

           function create(){
              for(let i =0; i < spriteCount; i++){
            let s  = this.add.sprite(60*i, 40*i, 'balloon');
            sprites.push(s);
        }
            player = this.add.sprite(400, 300, 'digdug');
            this.anims.create({
                key: 'walk',
                frames: this.anims.generateFrameNumbers('digdug', {start:0, end:3}),
                frameRate: 5,
                repeat: -1
            });

            player.play('walk');

            cursors = this.input.keyboard.createCursorKeys();
            }

            function update(){
                for(let i = 0; i < spriteCount; i++){
                    if (sprites[i].x < 800)
                        sprites[i].x += speed;
                     else  sprites[i].x = 0;
                    checkHit(sprites[i]);
                }

                checkKeys();

            }

           function checkKeys(){
            if (cursors.left.isDown){
               player.x -= speed;
            } else if (cursors.right.isDown){
               player.x += speed;
               }
            if (cursors.up.isDown){
               player.y -= speed;
            } else if (cursors.down.isDown){
               player.y += speed;
            }
            }

            function checkHit(sprite){
             let d = Phaser.Math.Distance.Between(sprite.x, sprite.y, player.x, player.y);

             if (d<20){
                sprite.y = Math.pow(10,16);
                increaseScore();
                checkWin();
             }
            }

            function increaseScore(){
                score++;
                const scoreDiv = document.getElementById('score');
                scoreDiv.innerText = 'SCORE:' + score;
            }

            function checkWin(){
                if (score == spriteCount){
                    window.alert('You win');
                    location.reload();
                }
            }
        </script>
    </body>
</html>
