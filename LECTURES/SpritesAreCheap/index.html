<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <script>
        const config = {
          type: Phaser.AUTO, // rendering style (WebGL or Canvas)
          width: 800,
          height: 600,
          parent: 'game-container',
          scene: {
            preload: preload,
            create: create,
            update: update
          }
        };

        const game = new Phaser.Game(config);
        let sprites = [];

        function preload() {
            this.load.image('balloon', 'balloon.png');
        }

        function create() {
            this.add.text(20, 20, 'Super fajna gra!', { font: '24px Arial', fill: '#ffffff' });

            for (let i = 0; i < 50; i++){
                let s = this.add.sprite(12 * i, 13*i, 'balloon');
                sprites.push(s);
            }
        }

        function update() {
            for (let i = 0; i < 50; i++){
                if (sprites[i].x < 800)
                    sprites[i].x += i;
                else
                    sprites[i].x = 0;
            }
        }
    </script>
</body>
</html>
