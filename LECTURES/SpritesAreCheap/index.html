<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>
<body>
<div id="game-container"></div>
<script>
    const config = {
      type: Phaser.AUTO, // rendering style (WebGL or Canvas)
      width: 800,
      height: 600,
      parent: 'game-container',
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);
    const spritesCount = 12;
    let sprites = [];

    let player = null;

    function preload() {
        this.load.image('balloon', 'balloon.png');
        this.load.spritesheet('digdug', 'empty-project/dig-dug.png', {
            frameWidth: 75,
            frameHeight: 75
        });
    }

    function create() {
        this.add.text(20, 20, 'Super fajna gra!', { font: '24px Arial', fill: '#ffffff' });

        for (let i = 0; i < spritesCount; i++){
            let s = this.add.sprite(i, 50*i, 'balloon');
            s.active = true;
            sprites.push(s);
        }

        player = this.add.sprite(400, 300, 'digdug');
        this.anims.create({
            key: 'walk',
            frames: this.anims.generateFrameNumbers('digdug', { start: 0, end: 3 }),
            frameRate: 5,
            repeat: -1
        });

        player.play('walk');
    }

    function update() {
        for (let i = 0; i < spritesCount; i++){
            if (!sprites[i].active)
                continue;

            if (sprites[i].x < 800)
                sprites[i].x += (i+1) % 20;
            else
                sprites[i].x = 0;

            checkHit(sprites[i]);
        }
    }

    function checkHit(sprite){
        let d = Phaser.Math.Distance.Between(sprite.x + sprite.width/2, sprite.y + sprite.height/2
            , player.x + player.width/2, player.y + player.height/2);

        if (d < 20){
            sprite.active = false;
            sprite.y = Math.pow(10,16);
        }
    }
</script>
</body>
</html>
