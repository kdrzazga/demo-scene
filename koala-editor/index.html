<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Koala Editor</title>
    <style>
        :root {
            --panel: #1b1a33;
            --border: #3a3870;
            --text: #c8c6ff;
            --accent: #6b66e4;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: #0f0e1f;
            color: var(--text);
            font: 13px monospace;
        }

        body {
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 1fr auto;
            height: 100vh;
        }

        body.active {
            outline: 4px dashed var(--accent);
            outline-offset: -4px;
        }

        aside {
            grid-row: 1 / 3;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        h2 {
            margin: 0 0 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        button, select {
            font: inherit;
            color: var(--text);
            background: #26244a;
            border: 1px solid var(--border);
            padding: 4px 6px;
            cursor: pointer;
        }

        button:hover {
            border-color: var(--accent);
        }

        button.active {
            background: var(--accent);
            color: #fff;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        #tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        #swatches {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .swatch {
            height: 34px;
            border: 2px solid transparent;
            font-weight: bold;
            position: relative;
        }

        .swatch.primary {
            border-color: #fff;
        }

        .swatch.secondary {
            outline: 2px dashed #fff;
            outline-offset: -6px;
        }

        .indicator {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
        }

        #cell .slot {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        #cell em {
            margin-left: auto;
            opacity: 0.6;
        }

        .chip {
            width: 14px;
            height: 14px;
            border: 1px solid var(--border);
            flex: none;
        }

        label {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        main {
            overflow: auto;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        #canvas {
            display: block;
            cursor: crosshair;
            box-shadow: 0 0 0 1px var(--border);
        }

        #status {
            padding: 6px 10px;
            border-top: 1px solid var(--border);
            background: var(--panel);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .help {
            font-size: 11px;
            line-height: 1.5;
            opacity: 0.7;
        }

        #file {
            display: none;
        }
    </style>
</head>
<body>
<aside>
    <section>
        <h2>File</h2>
        <div class="row">
            <button id="new">New</button>
            <button id="open">Open</button>
            <button id="save">Save .kla</button>
        </div>
    </section>
    <section>
        <h2>Edit</h2>
        <div class="row">
            <button id="undo">Undo</button>
            <button id="redo">Redo</button>
        </div>
    </section>
    <section>
        <h2>Tools</h2>
        <div id="tools"></div>
    </section>
    <section>
        <h2>Colors</h2>
        <div id="swatches"></div>
        <div class="row" style="margin-top: 6px">
            <div id="primary" class="indicator" title="Left mouse button"></div>
            <button id="swap" title="Swap (X)">⇄</button>
            <div id="secondary" class="indicator" title="Right mouse button"></div>
        </div>
    </section>
    <section>
        <h2>Image</h2>
        <label>Background <select id="background"></select></label>
        <label style="margin-top: 6px">Palette <select id="palette"></select></label>
        <label style="margin-top: 6px"><input id="replace" type="checkbox"> Replace on clash (R)</label>
    </section>
    <section>
        <h2>View</h2>
        <div class="row">
            <button id="zoom-out">−</button>
            <span id="zoom">3x</span>
            <button id="zoom-in">+</button>
        </div>
        <label style="margin-top: 6px"><input id="cell-grid" type="checkbox" checked> Cell grid (G)</label>
        <label><input id="pixel-grid" type="checkbox"> Pixel grid (H)</label>
    </section>
    <section>
        <h2>Cell</h2>
        <div id="cell"></div>
    </section>
    <section class="help">
        <h2>Help</h2>
        Left / right click: paint primary / secondary<br>
        Alt + click: pick color<br>
        0-9: primary color, Shift + 0-9: secondary<br>
        Ctrl + wheel, + / −: zoom<br>
        Ctrl + Z / Y: undo / redo, Ctrl + S: save<br>
        Drop a .kla / .koa / .gg file anywhere to open
    </section>
</aside>
<main><canvas id="canvas"></canvas></main>
<div id="status"></div>
<input id="file" type="file" accept=".kla,.koa,.gg">
<script src="js/C64Palette.js"></script>
<script src="js/GgUnpacker.js"></script>
<script src="js/KoalaImage.js"></script>
<script src="js/DropZone.js"></script>
<script src="js/EditHistory.js"></script>
<script src="js/EditorView.js"></script>
<script src="js/Tools.js"></script>
<script src="js/ColorPanel.js"></script>
<script src="js/CellPanel.js"></script>
<script src="js/KoalaEditorApp.js"></script>
</body>
</html>
