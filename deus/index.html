<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deus Ex</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05080b; }
    #stage canvas { display: block; }
    #start {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: none;
        animation: appear 0.8s ease-out 5.8s both;
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    #start[hidden] { display: none; }
    #start-button {
        pointer-events: auto;
        font: bold 22px Arial, Helvetica, sans-serif; letter-spacing: 6px; color: rgba(230, 238, 243, 0.85);
        padding: 14px 48px; cursor: pointer;
        background: linear-gradient(rgba(34, 48, 58, 0.45), rgba(11, 17, 23, 0.45)); border: 2px solid rgba(143, 161, 173, 0.6);
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    }
    #crosshair { display: none; position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(230, 238, 243, 0.8); }
    #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
    #crosshair::after { left: 0; top: 6px; width: 14px; height: 2px; }
    body.aiming #crosshair { display: block; }
    .terminal-window {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 340px; padding: 18px 22px 20px;
        background: rgba(10, 18, 40, 0.72); border: 2px solid rgba(110, 140, 230, 0.75); color: #cfdcff;
        font: 15px Arial, Helvetica, sans-serif; box-shadow: 0 0 24px rgba(40, 80, 220, 0.35);
    }
    .terminal-window[hidden] { display: none; }
    .terminal-title { font-weight: bold; letter-spacing: 1px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(110, 140, 230, 0.5); }
    .terminal-field { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .terminal-field input {
        width: 190px; padding: 5px 7px; font: 15px Consolas, monospace; color: #e6eeff;
        background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(110, 140, 230, 0.6); outline: none;
    }
    .terminal-field input:focus { border-color: #9fb4ff; }
    .terminal-status { min-height: 18px; color: #ff6a6a; font-weight: bold; letter-spacing: 2px; text-align: center; }
    .terminal-buttons { display: flex; justify-content: center; gap: 14px; margin-top: 12px; }
    .terminal-button {
        padding: 6px 30px; font: bold 14px Arial, Helvetica, sans-serif; letter-spacing: 2px;
        color: #e6eeff; background: rgba(40, 60, 140, 0.6); border: 1px solid rgba(110, 140, 230, 0.8); cursor: pointer;
    }
    .terminal-button:hover { background: rgba(60, 90, 190, 0.75); }
    #start-button:hover { color: #fff; border-color: rgba(207, 224, 234, 0.85); background: linear-gradient(rgba(44, 61, 74, 0.6), rgba(17, 26, 34, 0.6)); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="crosshair"></div>
<div id="start"><button id="start-button">START</button></div>
<script src="../common/three.min.js"></script>

<script src="npc/anna-navarre.js"></script>
<script src="npc/maggie-chow.js"></script>
<script src="first-person-controller.js"></script>

<script>
    new Demo({
        music: 'title.mp3',
        transmissions: [
            {
                checkpoint: [2, 8],
                radius: 3,
                photo: 'alex.png',
                message: 'alex.mp3',
                name: 'Krzychu',
                text: 'Heads up JC! Click the screen to enable mouse movement. You can find your brother Paul further on the pier,'
                +' just like in year 2000. Paul Denton looks like he comes from ALIEXPRESS :D :D :D',
            },
            {
                checkpoint: [-90, -46],
                radius: 4,
                photo: 'alex.png',
                name: 'Krzychu',
                text: 'You can meet Anna Navarre on the left.',
            },
            {
                checkpoint: { minX: -152, maxX: -112.8, minZ: -110, maxZ: -80 },
                photo: 'alex.png',
                name: 'Krzychu',
                text: 'Here you can meet Maggie Chow from Hong Kong, which is another alteration from the original game (and its plot).',
            },
            {
                checkpoint: { minX: -212.8, maxX: -112.8, minZ: -50.4, maxZ: -41.6 },
                requires: { talkedTo: ['Anna Navarre'], alive: ['Anna Navarre'] },
                photo: 'anna.png',
                name: 'Anna Navarre',
                text: 'Watch out! This passage is heavily guarded by terrorists.',
            },
        ],
    });
</script>

</html>
