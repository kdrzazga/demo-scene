<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civ — One City</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b1116; color: #eceff1; font-family: monospace; }
        #app { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
        #game canvas { display: block; border: 2px solid #24333f; }
        #panel { width: 320px; max-height: 560px; overflow-y: auto; }
        .block { background: #131e27; border: 1px solid #24333f; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
        .block h3 { margin: 0 0 8px; font-size: 13px; color: #90a4ae; text-transform: uppercase; letter-spacing: 1px; }
        .stat { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 2px 0; }
        .stat span:last-child { color: #b0bec5; text-align: right; }
        button.build { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px; background: #1c2b36; color: #eceff1; border: 1px solid #2e4250; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px; }
        button.build:hover { background: #24384a; }
        button.build.active { border-color: #ffeb3b; background: #243447; }
        .actions { display: flex; gap: 8px; }
        .actions button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; background: #37474f; color: #fff; }
        button.primary { background: #2e7d32; }
        button.primary:hover { background: #388e3c; }
        .actions button:disabled { opacity: 0.4; cursor: default; }
        .bar { height: 8px; background: #0b1116; border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .fill { height: 100%; background: #ffb300; }
        .report { color: #ffcc80; font-size: 13px; }
        .good { color: #81c784; }
        .bad { color: #ff8a65; font-weight: bold; }
        #panel select { background: #1c2b36; color: #eceff1; border: 1px solid #2e4250; border-radius: 4px; font-family: monospace; padding: 2px 6px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="game"></div>
        <div id="panel"></div>
    </div>
    <script src="../common/phaser.min.js"></script>
    <script src="files/TerrainType.js"></script>
    <script src="files/Tile.js"></script>
    <script src="files/Building.js"></script>
    <script src="files/Ruleset.js"></script>
    <script src="files/CityMap.js"></script>
    <script src="files/City.js"></script>
    <script src="files/Hud.js"></script>
    <script src="files/TerrainScene.js"></script>
    <script src="files/CityScene.js"></script>
    <script src="files/main.js"></script>
</body>
</html>
